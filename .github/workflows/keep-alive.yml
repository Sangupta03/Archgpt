name: Keep Backend Warm

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health
        # a cold start on Render's free tier has been measured taking ~60s;
        # 30s was cutting the request off before the backend finished
        # booting, marking every cold ping as a false failure
        run: curl -sf --max-time 90 https://archgpt-backend.onrender.com/health
